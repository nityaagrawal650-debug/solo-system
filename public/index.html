<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Solo System AI Tutor</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101014;
      color: #f4f0e8;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 600px;
      margin: 30px auto;
      padding: 24px;
      border: 1px solid #44404d;
      border-radius: 16px;
      background: #1b1a22;
    }
    h1 { color: #d7b46a; }
    button, input, select {
      box-sizing: border-box;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
    }
    button { cursor: pointer; }
    #reply { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SOLO SYSTEM</h1>
    <p>AI Tutor | CLAT + Class 12</p>

    <select id="language">
      <option value="Hinglish">Hindi / Hinglish</option>
      <option value="English">English</option>
    </select>

    <input id="question" placeholder="Ask your study doubt...">
    <button id="ask">Ask AI Tutor</button>
    <button id="call">Start Voice Call</button>

    <p id="reply">Your tutor's response will appear here.</p>
  </main>

  <script>
    const ask = document.getElementById("ask");
    const call = document.getElementById("call");
    const reply = document.getElementById("reply");

    ask.addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      const language = document.getElementById("language").value;

      if (!question) {
        reply.textContent = "Please enter your question first.";
        return;
      }

      reply.textContent = "Thinking...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, language })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");

        reply.textContent = data.answer || data.output_text ||
          JSON.stringify(data);
      } catch (error) {
        reply.textContent =
          "Tutor connection failed. Check your backend deployment.";
      }
    });

    call.addEventListener("click", () => {
      reply.textContent =
        "Live calling needs the Realtime API connection and microphone setup.";
    });
  </script>
</body>
</html>
